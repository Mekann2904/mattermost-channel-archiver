[project]
name = "mattermost-channel-archiver"
version = "0.1.0"
description = "Export and locally browse/search a Mattermost channel's log and attachments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
    "flask>=3.1.3",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
mm-export = "mmlog.export:main"
mm-view = "mmlog.viewer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mmlog"]
